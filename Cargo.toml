[package]
name = "Oxyshop"
version = "1.1.1"
edition = "2024"

[features]
default = ["desktop"]
desktop = []

[[bin]]
name = "Oxyshop"
path = "src/main.rs"
required-features = ["desktop"]

[lib]
crate-type = ["cdylib"]
name = "oxyshop_and"
path = "src/lib.rs"

[dependencies]
base64 = "0.23"
chrono = "0.4"
dirs = "7"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "blocking", "json"] }
serde      = { version = "1.0.2", features = ["derive"] }
serde_json = "1.0.1"
url = "2.5"

# --- Desktop ---
[target.'cfg(not(target_os = "android"))'.dependencies]
rfd   = "0.18"
slint = { version = "1.19", features = ["backend-winit", "renderer-femtovg"] }

# --- Android ---
[target.'cfg(target_os = "android")'.dependencies]
slint            = { version = "1.19", features = ["backend-android-activity-06", "renderer-skia"] }
android-activity = { version = "0.6.1", features = ["native-activity"] }
image            = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
jni              = "0.22"
ndk-sys          = "0.6"
ocrs             = { version = "0.14", features = ["onnx", "rten"] }
rten             = "0.28"
webpki-roots     = "1.0.12"
rustls           = { version = "0.23", features = ["aws_lc_rs"] }

[build-dependencies]
slint-build = "1.19"

[target.'cfg(target_os = "windows")'.build-dependencies]
winresource = "0.1"

[package.metadata.android]
package   = "io.github.promethyxx.oxyshop"
resources = "assets/res"
assets    = "assets/models"

[package.metadata.android.sdk]
min_sdk_version    = 28
target_sdk_version = 36

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[[package.metadata.android.uses_permission]]
name = "android.permission.CAMERA"

[[package.metadata.android.uses_feature]]
name     = "android.hardware.camera"
required = false

[package.metadata.android.application]
label = "Oxyshop"
icon  = "@mipmap/ic_launcher"

[profile.release]
opt-level     = "z"
lto           = true
codegen-units = 1
strip         = true
