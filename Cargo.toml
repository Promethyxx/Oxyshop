[package]
name = "Oxyshop"
version = "0.9.2"
edition = "2024"

[features]
desktop = []

[[bin]]
name = "Oxyshop"
path = "src/main.rs"
required-features = ["desktop"]

[lib]
crate-type = ["cdylib"]
name = "Oxyshop"
path = "src/lib.rs"

[dependencies]
base64 = "0.22"
chrono = "0.4"
dirs = "6"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "blocking", "json"] }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2.5"

# --- Desktop ---
[target.'cfg(not(target_os = "android"))'.dependencies]
rfd   = "0.17"
slint = { version = "1.17", features = ["backend-winit", "renderer-femtovg"] }

# --- Android ---
[target.'cfg(target_os = "android")'.dependencies]
slint            = { version = "1.17", features = ["backend-android-activity-06", "renderer-skia"] }
android-activity = { version = "0.6.1", features = ["native-activity"] }
webpki-roots     = "1.0.6"
rustls           = { version = "0.23", features = ["aws_lc_rs"] }

[build-dependencies]
slint-build = "1.17"

[target.'cfg(target_os = "windows")'.build-dependencies]
winresource = "0.1"

# La config Android (package, sdk, permissions, label, icon) est maintenant
# dans xbuild.yaml à la racine du projet : xbuild ne lit pas ce bloc,
# contrairement à cargo-apk qui l'utilisait auparavant.

[profile.release]
opt-level     = "z"
lto           = true
codegen-units = 1
strip         = true
