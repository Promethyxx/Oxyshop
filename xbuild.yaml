# Config lue par xbuild (remplace [package.metadata.android] utilisé par cargo-apk,
# que xbuild ignore totalement). Placé à la racine du projet, à côté de Cargo.toml.
#
# Référence (code source, pas de doc officielle complète) :
# https://github.com/rust-mobile/xbuild/blob/master/xbuild/src/config.rs
android:
  manifest:
    package: io.github.promethyxx.oxyshop
    sdk:
      min_sdk_version: 28
      target_sdk_version: 37
    application:
      label: Oxyshop
      icon: "@mipmap/ic_launcher"
      uses_permission:
        - name: android.permission.INTERNET
  assets:
    - assets/res
