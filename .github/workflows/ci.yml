name: Oxyshop CI/CD
on:
  workflow_dispatch:
permissions:
  contents: write
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: Win_x64
            artifact_name: Oxyshop_Win_x64.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            label: Lin_x64
            artifact_name: Oxyshop_Lin_x64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            label: Lin_arm64
            artifact_name: Oxyshop_Lin_ARM
    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.label }}
    steps:
    - uses: actions/checkout@v7
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}
    - name: Cache Cargo
      uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ matrix.label }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: ${{ matrix.label }}-cargo-
    - name: Install Linux deps
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc g++ cmake pkg-config libfontconfig1-dev \
          libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
          libgl1-mesa-dev libwayland-dev libxkbcommon-dev libssl-dev
    - name: Build
      run: cargo build --release --features="desktop" --target ${{ matrix.target }}
    - name: Prepare binary (Windows)
      if: runner.os == 'Windows'
      run: Copy-Item target/${{ matrix.target }}/release/Oxyshop.exe ${{ matrix.artifact_name }}
      shell: pwsh
    - name: Prepare binary (Linux)
      if: runner.os == 'Linux'
      run: |
        cp target/${{ matrix.target }}/release/Oxyshop ${{ matrix.artifact_name }}
        chmod +x ${{ matrix.artifact_name }}
    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: binary-${{ matrix.label }}
        path: ${{ matrix.artifact_name }}
  build-android:
    runs-on: ubuntu-latest
    name: Build Android APK
    steps:
    - uses: actions/checkout@v7
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-linux-android
    - name: Install LLVM/clang toolchain
      # xbuild downloads its own slimmed-down NDK (libs/headers only) and expects
      # clang/llvm-ar/lld to already be present on the host — they're not on
      # ubuntu-latest by default under these exact names.
      run: sudo apt-get update && sudo apt-get install -y clang lld llvm
    - name: Cache Cargo
      uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: android-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: android-cargo-
    - name: Setup Java
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 21
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    - name: Install Android platform 37 (SDK, for aapt/manifest tooling)
      run: |
        sdkmanager "platforms;android-37.0"
        ln -sf $ANDROID_SDK_ROOT/platforms/android-37.0 $ANDROID_SDK_ROOT/platforms/android-37
    - name: Install xbuild
      # crates.io release of xbuild is stale/broken for some targets (rust-mobile/xbuild#164),
      # so we install straight from the repo.
      run: cargo install --git https://github.com/rust-mobile/xbuild xbuild
    - name: Build APK (unsigned/debug-signed)
      # xbuild downloads and manages its own NDK independently of ANDROID_NDK_HOME.
      run: x build --release --platform android --arch arm64
    - name: Locate and rename raw APK
      run: |
        mkdir -p apk_out
        # Known xbuild+cdylib naming quirk (rust-mobile/xbuild, slint-ui/slint#5731):
        # the .so can end up named lib<crate>_lib.so instead of lib<crate>.so.
        # Harmless no-op if the file doesn't exist under that name.
        find target/x -name "*_lib.so" | while read -r f; do
          cp "$f" "${f%_lib.so}.so"
        done
        find target/x -name "*.apk" -exec cp {} apk_out/Oxyshop_And_unsigned.apk \; -quit
    - name: Sign APK
      env:
        KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE }}
        STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      run: |
        echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/keystore.jks"
        BUILD_TOOLS=$(ls "$ANDROID_SDK_ROOT/build-tools" | sort -V | tail -1)
        "$ANDROID_SDK_ROOT/build-tools/$BUILD_TOOLS/apksigner" sign \
          --ks "$RUNNER_TEMP/keystore.jks" \
          --ks-pass "env:STORE_PASSWORD" \
          --out apk_out/Oxyshop_And.apk \
          apk_out/Oxyshop_And_unsigned.apk
    - name: Upload APK
      uses: actions/upload-artifact@v7
      with:
        name: apk-android
        path: apk_out/Oxyshop_And.apk
  release:
    needs: [build, build-android]
    runs-on: ubuntu-latest
    name: Release
    steps:
    - uses: actions/checkout@v7
    - name: Get version
      id: version
      run: |
        VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
    - name: Download all artifacts
      uses: actions/download-artifact@v8
      with:
        merge-multiple: true
    - name: Deploy to GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ steps.version.outputs.version }}
        name: Oxyshop ${{ steps.version.outputs.version }}
        body: |
          ## Platforms
          | Platform | Oxyshop | Name |
          |---|:---:|---|
          | Android | ✅ | Oxyshop_And.apk |
          | Linux ARM64 | ✅ | Oxyshop_Lin_ARM |
          | Linux x64 | ✅ | Oxyshop_Lin_x64 |
          | Windows x64 | ✅ | Oxyshop_Win_x64.exe |
        files: |
          Oxyshop_Win_x64.exe
          Oxyshop_Lin_x64
          Oxyshop_Lin_ARM
          Oxyshop_And.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
