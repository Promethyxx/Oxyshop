name: Oxyshop CI/CD
on:
  workflow_dispatch:
permissions:
  contents: write
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  APP_ID: io.github.promethyxx.Oxyshop
  FREEDESKTOP: "25.08"
  KDE: "6.10"
jobs:
  build-windows:
    runs-on: windows-latest
    name: Build Win_x64
    steps:
    - uses: actions/checkout@v7
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: x86_64-pc-windows-msvc
    - name: Cache Cargo
      uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: Win_x64-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: Win_x64-cargo-
    - name: Build
      run: cargo build --release --features="desktop" --target x86_64-pc-windows-msvc
    - name: Prepare binary
      run: Copy-Item target/x86_64-pc-windows-msvc/release/Oxyshop.exe Oxyshop_Win_x64.exe
      shell: pwsh
    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: binary-Win_x64
        path: Oxyshop_Win_x64.exe

  build-flatpak:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
            artifact_name: Oxyshop_Lin_x64.flatpak
            label: Lin_x64
    runs-on: ${{ matrix.os }}
    name: Build Flatpak ${{ matrix.label }}
    steps:
    - uses: actions/checkout@v7
    - name: Install Flatpak tooling
      run: |
        sudo apt-get update
        sudo apt-get install -y flatpak flatpak-builder python3-pip curl
        flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
        flatpak install --user -y flathub \
          org.kde.Platform//${KDE} \
          org.kde.Sdk//${KDE} \
          org.freedesktop.Sdk.Extension.rust-stable//${FREEDESKTOP}
    - name: Generate cargo-sources.json
      run: |
        pip install --break-system-packages aiohttp tomlkit
        curl -fsSL -o flatpak-cargo-generator.py https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/master/cargo/flatpak-cargo-generator.py
        mkdir -p flatpak-build
        python3 flatpak-cargo-generator.py Cargo.lock -o flatpak-build/cargo-sources.json
    - name: Generate Flatpak manifest
      run: |
        cat > flatpak-build/${APP_ID}.yml <<EOF
        app-id: ${APP_ID}
        runtime: org.kde.Platform
        runtime-version: '${KDE}'
        sdk: org.kde.Sdk
        sdk-extensions:
          - org.freedesktop.Sdk.Extension.rust-stable
        command: Oxyshop
        finish-args:
          - --share=ipc
          - --share=network
          - --socket=wayland
          - --socket=fallback-x11
          - --device=dri
          - --filesystem=home
        build-options:
          append-path: /usr/lib/sdk/rust-stable/bin
          cflags: -g
          cflags-override: true
          cxxflags: -g
          cxxflags-override: true
          env:
            CARGO_HOME: /run/build/Oxyshop/cargo
        cleanup:
          - /include
          - /lib/cmake
          - /lib/pkgconfig
          - /share/doc
          - /share/man
          - '*.a'
          - '*.la'
        modules:
          - name: Oxyshop
            buildsystem: simple
            build-commands:
              - cargo build --release --offline --features="desktop"
              - install -Dm755 target/release/Oxyshop /app/bin/Oxyshop
              - install -Dm644 assets/${APP_ID}.desktop /app/share/applications/${APP_ID}.desktop
              - install -Dm644 assets/${APP_ID}.metainfo.xml /app/share/metainfo/${APP_ID}.metainfo.xml
              - install -Dm644 assets/Oxyshop_icon.png /app/share/icons/hicolor/512x512/apps/${APP_ID}.png
            sources:
              - type: git
                url: https://github.com/${GITHUB_REPOSITORY}.git
                commit: ${GITHUB_SHA}
              - cargo-sources.json
        EOF
        cat flatpak-build/${APP_ID}.yml
    - name: Cache Flatpak builder
      uses: actions/cache@v5
      with:
        path: .flatpak-builder
        key: flatpak-${{ matrix.arch }}-${{ hashFiles('Cargo.lock') }}
        restore-keys: flatpak-${{ matrix.arch }}-
    - name: Build Flatpak
      run: |
        flatpak-builder --user --force-clean --disable-rofiles-fuse --arch=${{ matrix.arch }} \
          --repo=flatpak-repo flatpak-build/build flatpak-build/${APP_ID}.yml
        flatpak build-bundle --arch=${{ matrix.arch }} flatpak-repo ${{ matrix.artifact_name }} ${APP_ID}
    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: flatpak-${{ matrix.label }}
        path: ${{ matrix.artifact_name }}

  build-android:
    runs-on: ubuntu-latest
    name: Build Android APK
    steps:
    - uses: actions/checkout@v7
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-linux-android
    - name: Cache Cargo
      uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: android-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: android-cargo-
    - name: Setup Java
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 21
    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
    - name: Install Android NDK and Platform
      run: |
        sdkmanager "ndk;29.0.14206865" "platforms;android-36"
        echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/29.0.14206865" >> $GITHUB_ENV
    - name: Setup keystore
      env:
        KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE }}
        STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      run: |
        echo "$KEYSTORE_B64" | base64 -d > "$GITHUB_WORKSPACE/keystore.jks"
        printf '\n[package.metadata.android.signing.release]\npath = "%s/keystore.jks"\n' "$GITHUB_WORKSPACE" >> Cargo.toml
        printf 'keystore_password = "%s"\n' "$STORE_PASSWORD" >> Cargo.toml
    - name: Install cargo-apk
      run: cargo install cargo-apk
    - name: Build APK
      run: cargo apk build --release --lib
      env:
        ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
    - name: Rename APK
      run: |
        mkdir -p apk_out
        find target -name "*.apk" -exec cp {} apk_out/Oxyshop_And.apk \;
    - name: Upload APK
      uses: actions/upload-artifact@v7
      with:
        name: apk-android
        path: apk_out/Oxyshop_And.apk

  release:
    needs: [build-windows, build-flatpak, build-android]
    runs-on: ubuntu-latest
    name: Release
    steps:
    - uses: actions/checkout@v7
    - name: Get version
      id: version
      run: |
        VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
    - name: Download all artifacts
      uses: actions/download-artifact@v8
      with:
        merge-multiple: true
    - name: Deploy to GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ steps.version.outputs.version }}
        name: Oxyshop ${{ steps.version.outputs.version }}
        body: |
          ## Platforms
          | Platform | Oxyshop | Name |
          |---|:---:|---|
          | Android | ✅ | Oxyshop_And.apk |
          | Linux x64 | ✅ | Oxyshop_Lin_x64.flatpak |
          | Windows x64 | ✅ | Oxyshop_Win_x64.exe |

          ## Linux install
          `flatpak install --user Oxyshop_Lin_x64.flatpak`
        files: |
          Oxyshop_Win_x64.exe
          Oxyshop_Lin_x64.flatpak
          Oxyshop_And.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
