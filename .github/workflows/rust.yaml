name: Oxyshop CI/CD

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: Win_x64

          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            label: Lin_x64

          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            label: Lin_arm64

    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.label }}

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Cache Cargo
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ matrix.label }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: ${{ matrix.label }}-cargo-

    - name: Install Linux deps
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc g++ cmake pkg-config libfontconfig1-dev \
          libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
          libgl1-mesa-dev libwayland-dev libxkbcommon-dev libssl-dev

    - name: Build
      run: cargo build --release --features="desktop" --target ${{ matrix.target }}

    - name: Prepare binary (Windows)
      if: runner.os == 'Windows'
      run: Copy-Item target/${{ matrix.target }}/release/oxyshop.exe Oxyshop_${{ matrix.label }}.exe
      shell: pwsh

    - name: Prepare binary (Linux)
      if: runner.os == 'Linux'
      run: |
        cp target/${{ matrix.target }}/release/oxyshop Oxyshop_${{ matrix.label }}
        chmod +x Oxyshop_${{ matrix.label }}

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: binary-${{ matrix.label }}
        path: Oxyshop_${{ matrix.label }}*

  build-android:
    runs-on: ubuntu-latest
    name: Build Android APK

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-linux-android

    - name: Cache Cargo
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: android-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: android-cargo-

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Android NDK
      run: |
        sdkmanager "ndk;27.2.12479018"
        echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> $GITHUB_ENV

    - name: Install cargo-apk
      run: cargo install cargo-apk

    - name: Build APK
      run: cargo apk build --release
      env:
        ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: apk-android
        path: target/release/apk/*.apk

  release:
    needs: [build, build-android]
    runs-on: ubuntu-latest
    name: Release

    steps:
    - uses: actions/checkout@v4

    - name: Get version
      id: version
      run: |
        VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        merge-multiple: true

    - name: Deploy to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ steps.version.outputs.version }}
        name: Oxyshop v${{ steps.version.outputs.version }}
        body: |
          ## Plateformes
          | Plateforme | Binaire |
          |---|:---:|
          | Windows x64 | ✅ |
          | Linux x64 | ✅ |
          | Linux ARM64 | ✅ |
          | Android | ✅ |
        files: |
          Oxyshop_*
          *.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
